<script>
const seed=[['airports.csv','CSV','30'],['booking_services.csv','CSV','60'],['bookings.csv','CSV','30'],['customers.csv','CSV','30'],['flights.csv','CSV','30'],['payments.csv','CSV','30']];
const domains=['travel','automotive','energy','finance','healthcare','insurance','manufacture','retail','telecom'];
const types=[['CSV','Delimited'],['XLSX','Excel workbook'],['XLS','Excel legacy'],['JSON','JSON records'],['PARQUET','Columnar'],['XML','XML records']];
const conns=[['Databricks','Unity Catalog'],['Snowflake','Cloud warehouse'],['PostgreSQL','Database'],['MySQL','Database'],['SQL Server','Database'],['Oracle','Database'],['Amazon S3','Object storage'],['Azure Data Lake','Data lake'],['Google BigQuery','Warehouse'],['JDBC','Any JDBC source']];
let state={page:'home',domain:'travel',files:seed.map(x=>({name:x[0],type:x[1],rows:+x[2]})),govern:false,toast:'',live:false};
const icons={home:'⌂',onboard:'⇧',ai:'✦',semantic:'◇',model:'⌘',qa:'✓',analytics:'▥',ask:'☷',genie:'✧',security:'◈',connectors:'⌁',audit:'◷',settings:'⚙'};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function navItem(id,label){return `<button class="${state.page===id?'active':''}" onclick="go('${id}')"><span>${icons[id]||'•'}</span>${label}</button>`}
function sidebar(){return `<aside class="side"><div class="brand"><div class="mark">C</div><div><b>C INVENT</b><small>Enterprise Semantic<br>Analytics Platform</small></div></div><div class="nav"><button class="home ${state.page==='home'?'active':''}" onclick="go('home')">⌂ <span>Home</span></button><div class="label">CREATE</div>${navItem('onboard','Data Onboarding')}${navItem('ai','AI Analysis')}${navItem('semantic','Semantic Intelligence')}${navItem('model','Business Model')}${navItem('qa','QA Validation')}<div class="label">ANALYZE</div>${navItem('analytics','Analytics')}${navItem('ask','Ask AI')}${navItem('genie','Genie Agent')}<div class="label">GOVERN</div><button class="${['security','connectors','audit'].includes(state.page)?'active':''}" onclick="state.govern=!state.govern;render()">◈ <span>Govern</span> ${state.govern?'⌄':'›'}</button>${state.govern?`<div class="sub">${navItem('security','Security Center')}${navItem('connectors','Connectors')}${navItem('audit','Audit & Policies')}</div>`:''}</div><div class="footer">C INVENT v6.0<br><span>● Platform ready</span></div></aside>`}
function top(){return `<header class="top"><div class="topBrand"><div class="mini">C</div><b>C INVENT</b></div><div class="ready"><i></i> ${state.live?'Connected':'Local workspace'}</div><div class="topRight"><button class="domain" onclick="go('onboard')">◉ Active Domain <b>${esc(state.domain)}</b>⌄</button><button onclick="go('ask')">⌕</button><button>◔</button><button onclick="go('settings')">⚙</button><div class="avatar">Z</div><b>Workspace</b></div></header>`}
function head(title,sub,icon,extra=''){return `<div class="hero"><div class="heroIcon">${icon}</div><div><h1>${title}</h1><p>${sub}</p></div>${extra}</div>`}
function metric(t,v,w=false){return `<div class="card metric"><span>${t}</span><strong class="${w?'warn':''}">${v}</strong><small class="${w?'warn':''}">${w?'Review recommended':'Ready'}</small></div>`}
function step(n){return `<div class="stepper">${['Onboard','AI Analysis','Semantic','Business Model','Publish'].map((x,i)=>`<div class="step ${i+1<=n?'done':''}"><b>${i+1}</b><span>${x}</span></div>${i<4?`<div class="line ${i+1<n?'done':''}"></div>`:''}`).join('')}</div>`}
function home(){return `<div class="page"><div class="homeHero"><div><span class="eyebrow">ENTERPRISE SEMANTIC ANALYTICS</span><h1>Turn raw data into governed business intelligence.</h1><p>C INVENT discovers structure, builds semantic models, publishes governed Metric Views and connects them to AI-powered analytics — through one metadata-driven experience.</p><button class="primary" onclick="go('onboard')">Start Data Onboarding →</button></div><div class="homeVisual"><div class="circle">C</div><div class="visualCard">✓ Governed semantic layer<small>Metric View → Analytics → Genie</small></div></div></div><div class="grid3">${metric('Published Domains','9')}${metric('Governed Metric Views','9')}${metric('Connected AI Agents','9')}</div></div>`}
function onboarding(){let fileRows=state.files.map(f=>`<div class="recent"><span class="green">✓</span><b>${esc(f.name)}</b><em>${f.type}${f.rows?' · '+f.rows+' rows':''}</em></div>`).join('');return `<div class="page">${head('Data Onboarding','Upload files, connect enterprise sources, or start with a sample domain — no Databricks knowledge required.','⇧',step(1))}<div class="tabs"><button class="sel">⇧ File Upload</button><button onclick="go('connectors')">⌁ Connect Data</button><button onclick="loadSample('travel')">✦ Sample Domain</button></div><div class="grid2"><section class="card"><h2>Domain Configuration</h2><label>Domain name *<input id="domain" value="${esc(state.domain)}"></label><label>Description (optional)<input placeholder="e.g. Travel, Telecom, Retail, Healthcare..."></label><div class="info">✓ Domain will be registered as <code>domain_${esc(state.domain)}</code></div></section><section class="card"><h2>Upload Tabular Data</h2><label class="drop"><input id="files" type="file" multiple accept=".csv,.xlsx,.xls,.json,.parquet,.xml" onchange="upload(event)"><b>⇧</b><b>Drag and drop files here</b><span>or click to browse</span><strong>Browse Files</strong><small>CSV · XLSX · XLS · JSON · PARQUET · XML · up to 200MB/file</small></label></section></div><div class="grid3"><section class="card"><h2>Supported Source File Types</h2><div class="types">${types.map(x=>`<div class="type"><b>${x[0]}</b><small>${x[1]}</small></div>`).join('')}</div><div class="info">✓ Parquet and XML are first-class onboarding formats.</div></section><section class="card"><h2>Quick Start</h2><select onchange="loadSample(this.value)">${domains.map(d=>`<option ${d===state.domain?'selected':''}>${d}</option>`).join('')}</select><p>Load a ready-to-analyze domain with source files, relationships and sample metrics.</p><button class="primary wide" onclick="loadSample(document.querySelector('.card select').value)">▶ Load Sample Data</button></section><section class="card"><h2>Current Files <span class="pill">${state.files.length}</span></h2>${fileRows||'<div class="info amber">No files uploaded yet.</div>'}</section></div><div class="bottom"><div class="security">◈ <b>Data Security</b><br>Files are profiled for PII/PHI, quality issues and relationship candidates before publication.</div><div class="stats"><b>${state.files.length}<small>Files</small></b><b>${Math.max(1,state.files.length*87)} KB<small>Uploaded</small></b><b>1<small>Domain</small></b></div><button class="primary" onclick="go('ai')" ${state.files.length?'':'disabled'}>Analyze My Data →</button></div></div>`}
function ai(){return `<div class="page">${head('AI Analysis','Profile source structure, quality, PII/PHI indicators and relationship candidates before semantic modeling.','✦',step(2))}<div class="grid4">${metric('Tables Detected',state.files.length||6)}${metric('Source Rows',180)}${metric('Columns Profiled',(state.files.length||6)*6)}${metric('PII / PHI Flags','4',true)}</div><section class="card"><div class="sectionHead"><div><h2>Analysis Results</h2><p>AI profiling completed for the current domain.</p></div><span class="pill success">✓ Complete</span></div><div class="analysis"><div>✓ Schema inference complete</div><div>✓ Relationship candidates detected</div><div>✓ PII/PHI scan complete</div><div>✓ Business descriptions generated</div><div>✓ Metric candidates generated</div><div>⚠ Security review recommended</div></div><button class="primary" onclick="go('semantic')">Review Semantic Intelligence →</button></section></div>`}
function semantic(){return `<div class="page">${head('Semantic Intelligence','Convert inferred structure into business meaning, relationships, measures and governed metadata.','◇',step(3))}<section class="card"><div class="sectionHead"><div><h2>Detected Semantic Model</h2><p>AI-generated metadata for <b>${esc(state.domain)}</b>.</p></div><span class="pill">${state.files.length} sources</span></div><div class="grid2">${state.files.slice(0,6).map((f,i)=>`<div class="row"><b>▣ ${esc(f.name)}</b><span>${i%2?'FACT':'DIMENSION'}</span><span class="green">✓</span></div>`).join('')}</div><div class="grid3"><div class="card"><b>Measures</b><p>total_service_amount<br>booking_services_count</p></div><div class="card"><b>Dimensions</b><p>service_type<br>customer_id<br>flight_id</p></div><div class="card"><b>Governance</b><p>Descriptions generated<br>PII/PHI flags attached</p></div></div><button class="primary" onclick="go('model')">Open Business Model →</button></section></div>`}
function model(){return `<div class="page">${head('Business Model','The governed semantic model, visualized — review relationships before publishing.','⌘',step(4))}<section class="card"><div class="sectionHead"><div><h2>Semantic Graph</h2><p>Detected fact/dimension relationships for the travel domain.</p></div><span class="pill success">No many-to-many</span></div><div class="graph"><div class="node"><div><b>booking_services.csv</b><small>FACT</small></div>⌁</div><div class="connectorLine">booking_id = booking_id · 88% confidence · N:1</div><div class="node"><div><b>bookings.csv</b><small>DIRECT DIMENSION / RELATED ENTITY</small></div>⌁</div><div class="branches"><div class="node"><div><b>customers.csv</b><small>INDIRECT DIMENSION</small></div></div><div class="node"><div><b>payments.csv</b><small>INDIRECT DIMENSION</small></div></div><div class="node"><div><b>flights.csv</b><small>INDIRECT DIMENSION</small></div></div></div></div><div class="counts">${metric('Fact Tables','3')}${metric('Dimension Tables','3')}${metric('Relationships','4')}${metric('Direct Fact Links','2')}${metric('Many-to-many','0')}</div><div class="publishBox">⚠<div><b>PII/PHI flagged columns detected</b><small>Publishing may proceed, but masking and access review are recommended.</small></div><button class="primary" onclick="go('qa')">Continue to QA →</button></div></section></div>`}
function qa(){return `<div class="page">${head('QA Validation','Validate schema, relationships, governance and publication readiness.','✓',step(5))}<div class="grid3">${metric('Schema Validation','PASS')}${metric('Relationship Validation','PASS')}${metric('Security Review','REVIEW',true)}</div><section class="card"><div class="sectionHead"><div><h2>Publication Readiness</h2><p>Everything required for the governed semantic layer is present.</p></div><span class="pill success">Ready with review</span></div><div class="checks"><div>✓ Delta tables ready to publish</div><div>✓ One canonical Metric View ready</div><div>⚠ PII/PHI masking review required</div><div>✓ Genie Agent configuration ready</div><div>✓ Metadata registry row ready</div><div>✓ Analytics renderer ready</div></div><button class="primary" onclick="go('publish')">Publish Domain →</button></section></div>`}
function publish(){return `<div class="page">${head('Publish','Create governed Delta tables, the canonical Metric View, registry metadata and the Genie connection.','☁','')}<section class="card"><div class="publishHead"><div><h2>Publish ${esc(state.domain)}</h2><p>One publish action makes the domain available to Analytics and Genie.</p></div><span class="pill success">Ready</span></div><div class="pubgrid"><div>✓ Delta tables</div><div>✓ Governed Metric View</div><div>✓ Metadata registry</div><div>✓ Genie Agent binding</div></div><div class="metricView"><b>Metric View</b><code>invent_semantic_platform.domain_${esc(state.domain)}.mv_domain</code></div><button class="primary" onclick="completePublish()">Publish This Domain →</button></section></div>`}
function analytics(){return `<div class="page">${head(state.domain+' Analytics','Auto-generated from the governed semantic model — switch domains without redeploy.','▥','<span class="pill success">Published</span>')}<section class="card"><h2>Governed Semantic Model</h2><div class="grid4">${metric('Domain',state.domain)}${metric('Fact Tables','3')}${metric('Dimensions','3')}${metric('Source Rows','180')}</div><div class="metricView"><b>Metric View</b><code>invent_semantic_platform.domain_${esc(state.domain)}.mv_domain</code><span>✓ Canonical analytics entry point</span></div></section><div class="grid2"><section class="card"><h2>Key Metrics</h2><div class="kpi"><span>Total Service Amount</span><b>81,000</b></div><div class="kpi"><span>Booking Services Count</span><b>180</b></div></section><section class="card"><h2>Business Dimensions</h2><div class="dimensions"><span>service_type</span><span>customer_id</span><span>flight_id</span><span>booking_id</span></div></section></div></div>`}
function ask(genie=false){let q=document.getElementById('q')?.value||'What are the key KPIs for this domain?';return `<div class="page">${head(genie?'Genie Agent':'Ask AI',genie?'Databricks-native conversational analytics over C INVENT’s governed semantic model.':'Ask business questions over C INVENT’s governed semantic layer.',genie?'✧':'☷','<span class="pill success">Connected</span>')}<section class="card"><h2>Ask a business question</h2><div class="question"><input id="q" value="${esc(q)}" placeholder="What are the key KPIs for this domain?"><button class="primary" onclick="askNow(${genie})">Ask ${genie?'Genie':'AI'} →</button></div><div class="examples"><button onclick="setQ('What are the key KPIs for this domain?')">What are the key KPIs for this domain?</button><button onclick="setQ('Show total service amount by service type')">Show total service amount by service type</button><button onclick="setQ('What tables are there and how are they connected?')">What tables are there and how are they connected?</button></div>${state.answer?`<div class="answer"><b>${genie?'Genie response':'AI answer'}</b><p>${esc(state.answer)}</p></div>`:''}</section><section class="card"><h2>Governed Source</h2><div class="sourceGrid"><span>Catalog <code>invent_semantic_platform</code></span><span>Schema <code>domain_${esc(state.domain)}</code></span><span>Metric View <code>invent_semantic_platform.domain_${esc(state.domain)}.mv_domain</code></span><span>${genie?'Genie Agent':'Governance'} <b>${genie?'01f197de288310c08cf950126de5b966':'Unity Catalog'}</b></span></div></section></div>`}
function security(){return `<div class="page">${head('Security Center','Review PII/PHI findings, masking recommendations and access posture before sharing governed data.','◈','')}<div class="grid3">${metric('PII / PHI Findings','4',true)}${metric('Masking Policies','0',true)}${metric('Access Review','Required',true)}</div><section class="card"><h2>Detected Sensitive Columns</h2>${['customers.csv · customer_name','customers.csv · email','customers.csv · phone','customers.csv · date_of_birth'].map(x=>`<div class="row"><b>⌾ ${x}</b><span>Review masking</span><button class="secondary">Configure</button></div>`).join('')}</section></div>`}
function connectors(){return `<div class="page">${head('Connectors','Configure enterprise source connections for repeatable onboarding.','⌁','')}<section class="card"><div class="connectorGrid">${conns.map(c=>`<button class="connector" onclick="openConn('${esc(c[0])}','${esc(c[1])}')"><div class="ci">⌁</div><b>${c[0]}</b><small>${c[1]}</small><span>Configure →</span></button>`).join('')}</div></section></div>`}
function audit(){return `<div class="page">${head('Audit & Policies','Track publication actions and governed semantic changes.','◷','')}<section class="card"><h2>Recent Actions</h2>${['Semantic model analyzed','PII/PHI scan completed','Metric View prepared','Genie Agent bound to domain','Analytics metadata registered'].map((x,i)=>`<div class="audit"><span class="green">●</span><div style="flex:1"><b>${x}</b><small>${i+1} minute${i?'s':''} ago · C INVENT workspace</small></div><span class="green">✓</span></div>`).join('')}</section></div>`}
function settings(){return `<div class="page">${head('Workspace Settings','Configure the C INVENT workspace and optional live Databricks connection.','⚙','')}<section class="card"><h2>Databricks Connection</h2><div class="grid2"><label>Workspace URL<input id="host" placeholder="https://adb-...azuredatabricks.net"></label><label>SQL Warehouse ID<input placeholder="e.g. 7f3..."></label><label>Catalog<input value="invent_semantic_platform"></label><label>Authentication<input placeholder="Workspace secret / OAuth / PAT"></label></div><div class="notice amber">⌾ Credentials should be stored in Databricks secrets or an application backend; never commit tokens to the browser.</div><div class="modalActions"><button class="secondary" onclick="state.live=false;toast('Local mode enabled')">Use Local Mode</button><button class="primary" onclick="state.live=!!document.getElementById('host').value;toast(state.live?'Connection settings saved':'Enter a workspace URL to enable live mode')">Save Connection</button></div></section></div>`}
function render(){document.getElementById('app').innerHTML=sidebar()+top()+content();}
function content(){switch(state.page){case'home':return home();case'onboard':return onboarding();case'ai':return ai();case'semantic':return semantic();case'model':return model();case'qa':return qa();case'publish':return publish();case'analytics':return analytics();case'ask':return ask(false);case'genie':return ask(true);case'security':return security();case'connectors':return connectors();case'audit':return audit();case'settings':return settings();default:return home()}}
function go(p){state.page=p;if(p!=='ask'&&p!=='genie')state.answer='';render()}function toast(m){state.toast=m;render();setTimeout(()=>{state.toast='';render()},2000)}
function upload(e){const arr=[...e.target.files];state.files=[...state.files,...arr.map(f=>({name:f.name,type:(f.name.split('.').pop()||'').toUpperCase(),rows:null,size:f.size}))];toast(arr.length+' file'+(arr.length>1?'s':'')+' uploaded')}
function loadSample(d){state.domain=d;state.files=seed.map(x=>({name:x[0],type:x[1],rows:+x[2]}));state.page='ai';toast(d+' sample domain loaded')}
function completePublish(){state.page='analytics';toast(state.domain+' published successfully')}
function setQ(q){state.answer='';state.page=state.page;render();setTimeout(()=>{let x=document.getElementById('q');if(x){x.value=q;x.focus() }},0)}
function askNow(){let q=document.getElementById('q')?.value||'What are the key KPIs for this domain?';state.answer=`Using the governed Metric View invent_semantic_platform.domain_${state.domain}.mv_domain, the current model exposes Total Service Amount of 81,000 and Booking Services Count of 180.`;render()}
function openConn(name,desc){document.body.insertAdjacentHTML('beforeend',`<div class="modalbg" id="modal"><div class="modal"><div class="modalTop"><div><h2>Configure ${name}</h2><p>${desc}</p></div><button onclick="document.getElementById('modal').remove()">✕</button></div><label>Connection name<input value="${name}"></label><label>Endpoint / host<input placeholder="https://... or host:port"></label><label>Authentication<input placeholder="Use workspace secret / OAuth / token"></label><div class="notice amber">⌾ Credentials are not displayed and should be stored in a secret manager in production.</div><div class="modalActions"><button class="secondary" onclick="document.getElementById('modal').remove()">Cancel</button><button class="primary" onclick="document.getElementById('modal').remove();toast('${name} connector saved locally')">Save Connector</button></div></div></div>`)}
render();
</script></body></html>
